<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Truyện Tiên Hiệp</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f1117;
      color: #eeeeee;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    header {
      background: #171a23;
      border-bottom: 1px solid #292e3b;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #f5c451;
      white-space: nowrap;
    }

    .search {
      flex: 1;
    }

    .search input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #343a49;
      background: #0d0f14;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .search input:focus {
      border-color: #f5c451;
    }

    /* NAV */

    nav {
      background: #13161e;
      border-bottom: 1px solid #292e3b;
    }

    .nav-inner {
      max-width: 1200px;
      margin: auto;
      padding: 10px 20px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .category {
      border: 0;
      background: #202531;
      color: #ddd;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .category:hover,
    .category.active {
      background: #f5c451;
      color: #111;
    }

    /* MAIN */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .hero {
      background:
        radial-gradient(circle at 80% 20%, rgba(245,196,81,.25), transparent 30%),
        linear-gradient(135deg, #20263a, #141720);
      border: 1px solid #303646;
      border-radius: 18px;
      padding: 40px;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 10px;
      color: #f5c451;
    }

    .hero p {
      color: #bfc4d0;
      max-width: 650px;
      margin-bottom: 20px;
    }

    .hero-button {
      display: inline-block;
      background: #f5c451;
      color: #111;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: bold;
    }

    /* SECTION */

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: 24px;
    }

    .section-title span {
      color: #f5c451;
    }

    /* BOOK GRID */

    .books {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .book {
      background: #171a23;
      border: 1px solid #292e3b;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: .2s;
    }

    .book:hover {
      transform: translateY(-4px);
      border-color: #f5c451;
    }

    .cover {
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      font-size: 23px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(145deg, #422006, #b45309);
    }

    .cover.blue {
      background: linear-gradient(145deg, #082f49, #0369a1);
    }

    .cover.purple {
      background: linear-gradient(145deg, #2e1065, #7e22ce);
    }

    .cover.green {
      background: linear-gradient(145deg, #052e16, #15803d);
    }

    .book-info {
      padding: 15px;
    }

    .book-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .author {
      color: #aeb4c1;
      font-size: 14px;
    }

    .chapters {
      margin-top: 8px;
      color: #f5c451;
      font-size: 13px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid #292e3b;
      background: #111319;
      text-align: center;
      padding: 30px 20px;
      color: #777e8d;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
      .books {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .header-inner {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .logo {
        text-align: center;
      }

      .hero {
        padding: 25px;
      }

      .hero h1 {
        font-size: 29px;
      }

      .books {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .cover {
        height: 210px;
        font-size: 19px;
      }
    }

    @media (max-width: 400px) {
      .books {
        grid-template-columns: 1fr 1fr;
      }

      .cover {
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">

      <div class="logo">
        📖 TRUYỆN TU TIÊN
      </div>

      <div class="search">
        <input
          type="text"
          id="search"
          placeholder="🔍 Tìm truyện, tác giả..."
        >
      </div>

    </div>
  </header>

  <nav>
    <div class="nav-inner">

      <button class="category active" onclick="filterBooks('all')">
        Tất cả
      </button>

      <button class="category" onclick="filterBooks('Tiên hiệp')">
        Tiên hiệp
      </button>

      <button class="category" onclick="filterBooks('Tu tiên')">
        Tu tiên
      </button>

      <button class="category" onclick="filterBooks('Huyền huyễn')">
        Huyền huyễn
      </button>

      <button class="category" onclick="filterBooks('Đô thị')">
        Đô thị
      </button>

      <button class="category" onclick="filterBooks('Xuyên không')">
        Xuyên không
      </button>

    </div>
  </nav>

  <main>

    <section class="hero">

      <h1>Thế giới truyện vô tận</h1>

      <p>
        Khám phá những câu chuyện tiên hiệp, tu tiên,
        huyền huyễn, đô thị và xuyên không.
        Đọc truyện miễn phí trên mọi thiết bị.
      </p>

      <a href="#truyen-moi" class="hero-button">
        📚 Xem truyện
      </a>

    </section>


    <section id="truyen-moi">

      <div class="section-title">

        <h2>
          🔥 <span>Truyện mới</span>
        </h2>

      </div>


      <div class="books" id="book-list">
<div style="padding:30px;text-align:center;color:#f5c451;">
        ⏳ Đang tải truyện...
    </div>
      </div>

    </section>

  </main>


  <footer>

    📖 Truyện Tu Tiên

    <br><br>

    Website đang trong quá trình xây dựng.

  </footer>
  <!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://zpibmlocamawawvdhnci.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vDwOg58cEIBTTTiHp3ypHA_oW0QXmqB";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


// ===============================
// TẢI TRUYỆN TỪ SUPABASE
// ===============================

async function loadNovels() {

    const bookList = document.getElementById("book-list");

    bookList.innerHTML = `
        <div style="
            grid-column:1/-1;
            text-align:center;
            padding:40px;
            color:#f5c451;
        ">
            ⏳ Đang tải truyện...
        </div>
    `;


    const { data, error } = await supabaseClient
        .from("novels")
        .select(`
            id,
            title,
            slug,
            description,
            status
        `)
        .order("created_at", { ascending: false });


    if (error) {

        console.error("Supabase error:", error);

        bookList.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:40px;
                color:#ff6b6b;
            ">
                ❌ Không thể tải danh sách truyện.
                <br>
                <small>${error.message}</small>
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        bookList.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:40px;
                color:#aaa;
            ">
                📚 Chưa có truyện nào.
            </div>
        `;

        return;
    }


    bookList.innerHTML = "";


    data.forEach(function(novel, index) {

        const colors = ["", "blue", "purple", "green"];
        const color = colors[index % colors.length];

        const book = document.createElement("div");

        book.className = "book";

        book.dataset.title = novel.title || "";
        book.dataset.description = novel.description || "";
        book.dataset.category = "";

        book.innerHTML = `
            <div class="cover ${color}">
                📖<br>
                ${escapeHtml(novel.title)}
            </div>

            <div class="book-info">

                <div class="book-title">
                    ${escapeHtml(novel.title)}
                </div>

                <div class="author">
                    📚 Truyện đang được cập nhật
                </div>

                <div class="chapters">
                    📖 ${novel.status || "Đang ra"}
                </div>

            </div>
        `;

        book.addEventListener("click", function() {
            window.location.href = "#";
        });

        bookList.appendChild(book);
    });


    setupSearch();
}


// ===============================
// TÌM KIẾM
// ===============================

function setupSearch() {

    const searchInput = document.getElementById("search");

    searchInput.addEventListener("input", function() {

        const keyword = this.value
            .toLowerCase()
            .trim();

        const books = document.querySelectorAll(".book");

        books.forEach(function(book) {

            const title =
                (book.dataset.title || "").toLowerCase();

            const description =
                (book.dataset.description || "").toLowerCase();

            if (
                title.includes(keyword) ||
                description.includes(keyword)
            ) {
                book.style.display = "";
            } else {
                book.style.display = "none";
            }

        });

    });

}


// ===============================
// ESCAPE HTML
// ===============================

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text || "";

    return div.innerHTML;
}


// ===============================
// CHẠY WEBSITE
// ===============================

loadNovels();

</script>
</body>
</html>
